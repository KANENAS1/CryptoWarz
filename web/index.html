<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>CryptoWarz</title>
<style>
  /* One visual world on purpose: MTA station signage. Helvetica has been the
     subway's typeface since 1989; the ground is signage black and every route
     bullet below uses its real MTA colour. Single-theme by choice - every
     colour is painted explicitly so it holds on any host background. */
  :root{
    --ink:#0a0a0c; --panel:#16161a; --panel2:#1e1e24; --rule:#2c2c34;
    --paper:#f2f2f4; --dim:#9a9aa6; --faint:#5e5e6b;
    --green:#00933C;   /* 4·5·6 */
    --red:#EE352E;     /* 1·2·3 */
    --yellow:#FCCC0A;  /* N·Q·R·W */
    --purple:#B933AD;  /* 7 */
    --blue:#0039A6;    /* A·C·E, SIR */
    --orange:#FF6319;  /* B·D·F·M */
    --grey:#A7A9AC;    /* L */
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);
       font-size:15px;line-height:1.35;overflow:hidden}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .app{display:flex;flex-direction:column;height:100%;max-width:620px;margin:0 auto}

  /* ---------- signage header ---------- */
  header{background:#000;border-bottom:2px solid var(--rule);
         padding:10px 16px 9px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex:none}
  .stationline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .station{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .bul{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;
       justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none}
  .bul.dark{color:#000}
  .bul.sir{font-size:8px;letter-spacing:-.04em}
  .flavor{color:var(--dim);font-size:12.5px;margin-top:3px}
  .stats{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat span{font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
  .stat b{font-size:16px;font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--paper)}
  .dayband{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .day{font-size:10px;letter-spacing:.2em;color:var(--yellow);font-weight:700}
  .cap{flex:1;height:5px;background:var(--rule);border-radius:3px;overflow:hidden;max-width:140px}
  .cap i{display:block;height:100%;background:var(--yellow)}

  /* ---------- scroll body ---------- */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 8px}
  .alert{background:var(--yellow);color:#000;font-weight:700;font-size:13px;
         padding:9px 12px;border-radius:3px;margin:10px 0}
  .alert.bad{background:var(--red);color:#fff}
  h2{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:700;
     margin:16px 0 7px;text-transform:uppercase}

  .coin{border-bottom:1px solid var(--rule)}
  .coinrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;
           padding:11px 2px;cursor:pointer;min-height:52px}
  .sym{font-weight:700;font-size:15px}
  .cname{color:var(--faint);font-size:11px;margin-top:1px}
  .px{text-align:right}
  .px b{font-size:15px;font-weight:700}
  .tag{font-size:9px;letter-spacing:.12em;font-weight:700;padding:1px 5px;border-radius:2px;margin-left:6px}
  .tag.cheap{background:var(--green);color:#fff}
  .tag.dear{background:var(--red);color:#fff}
  .held{color:var(--yellow);font-size:11px;margin-top:2px;text-align:right}
  .trade{padding:4px 2px 13px;display:none}
  .coin.open .trade{display:block}
  .coin.open{background:var(--panel)}
  .btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  button{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em;
         border:1px solid var(--rule);background:var(--panel2);color:var(--paper);
         border-radius:3px;padding:11px 13px;min-height:44px;cursor:pointer;flex:1;min-width:64px}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.3}
  button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  button.buy{background:var(--green);border-color:var(--green);color:#fff}
  button.sell{background:var(--red);border-color:var(--red);color:#fff}
  button.go{background:var(--yellow);border-color:var(--yellow);color:#000}
  .note{color:var(--faint);font-size:11.5px;margin-top:6px}

  .svc{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .logbox{margin-top:14px;border-top:1px solid var(--rule);padding-top:9px}
  .logline{color:var(--dim);font-size:12px;padding:2.5px 0}
  .logline:first-child{color:var(--paper)}

  /* ---------- bottom bar ---------- */
  footer{flex:none;background:#000;border-top:2px solid var(--rule);padding:9px 16px;
         padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;align-items:center}
  footer button{flex:1}

  /* ---------- overlay ---------- */
  .sheet{position:fixed;inset:0;background:rgba(5,5,7,.96);z-index:50;display:none;
         flex-direction:column;padding:0 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));
         padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .sheet.on{display:flex}
  .sheet h3{font-size:12px;letter-spacing:.2em;color:var(--yellow);margin:0 0 12px;font-weight:700}
  .sheetscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .stop{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
        padding:13px 2px;border-bottom:1px solid var(--rule);cursor:pointer;min-height:56px}
  .stop .nm{font-weight:700;font-size:15px}
  .stop .meta{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap}
  .chip{font-size:9px;letter-spacing:.1em;font-weight:700;padding:1px 5px;border-radius:2px;
        border:1px solid var(--rule);color:var(--dim)}
  .chip.shark{border-color:var(--red);color:var(--red)}
  .chip.vault{border-color:var(--blue);color:#6f9bff}
  .chip.shop{border-color:var(--yellow);color:var(--yellow)}
  .heat{font-size:9px;letter-spacing:.1em;color:var(--faint)}
  .bullets{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:130px}

  /* ---------- end screen ---------- */
  .final{text-align:center;padding:26px 0}
  .final .big{font-size:40px;font-weight:700;letter-spacing:-.02em}
  .final .verdict{color:var(--yellow);font-size:15px;margin-top:12px;font-weight:700;text-wrap:balance}
  .brk{display:flex;flex-direction:column;gap:5px;margin:20px auto 0;max-width:280px}
  .brk div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:4px}
  .brk span{color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="dayband">
      <span class="day" id="day">DAY 1 OF 30</span>
      <div class="cap" aria-label="wallet capacity used"><i id="capbar" style="width:0%"></i></div>
      <span class="day num" id="capnum" style="color:var(--dim)">$0 / $25,000</span>
    </div>
    <div class="stationline">
      <span class="station" id="station">14 St-Union Sq</span>
      <span class="bullets" id="bullets"></span>
    </div>
    <div class="flavor" id="flavor">Everything connects here.</div>
    <div class="stats">
      <div class="stat"><span>CASH</span><b class="num up" id="cash">$2,000.00</b></div>
      <div class="stat"><span>DEBT</span><b class="num down" id="debt">$5,500.00</b></div>
      <div class="stat"><span>VAULT</span><b class="num flat" id="vault">$0.00</b></div>
      <div class="stat"><span>NET WORTH</span><b class="num down" id="net">-$3,500.00</b></div>
    </div>
  </header>

  <main id="main">
    <div id="alerts"></div>
    <h2>Market</h2>
    <div id="market"></div>
    <div id="svcwrap" hidden>
      <h2 id="svctitle">At this station</h2>
      <div class="svc" id="svc"></div>
    </div>
    <div class="logbox">
      <h2 style="margin-top:0">Platform</h2>
      <div id="log"></div>
    </div>
  </main>

  <footer>
    <button class="go" id="ride">RIDE THE TRAIN →</button>
    <button id="board" style="flex:0 0 auto;min-width:56px">BEST</button>
    <button id="newgame" style="flex:0 0 auto;min-width:56px">NEW</button>
  </footer>
</div>

<div class="sheet" id="travel">
  <h3>WHERE TO? — ONE DAY EACH WAY</h3>
  <div class="sheetscroll" id="stops"></div>
  <div style="padding-top:10px"><button id="cancel">CANCEL</button></div>
</div>

<div class="sheet" id="scores">
  <h3>YOUR BEST RUNS</h3>
  <div class="sheetscroll" id="scorelist"></div>
  <div style="padding-top:10px"><button id="closescores">BACK</button></div>
</div>

<div class="sheet" id="over">
  <div class="sheetscroll">
    <div class="final">
      <h3 style="margin-bottom:18px">THIRTY DAYS LATER</h3>
      <div class="big num" id="fscore">$0</div>
      <div class="verdict" id="fverdict"></div>
      <div class="brk num" id="fbreak"></div>
    </div>
  </div>
  <div style="padding-top:10px"><button class="go" id="again">RIDE AGAIN</button></div>
</div>

<script src="game.js"></script>
<script>
/* Real MTA route colours - the detail that makes this the subway rather than
   a generic dark UI. Yellow and grey take black text for contrast. */
const LINE_COLOR = {
  "1":"--red","2":"--red","3":"--red",
  "4":"--green","5":"--green","6":"--green",
  "7":"--purple",
  "A":"--blue","C":"--blue","E":"--blue","SIR":"--blue",
  "B":"--orange","D":"--orange","F":"--orange","M":"--orange",
  "N":"--yellow","Q":"--yellow","R":"--yellow","W":"--yellow",
  "L":"--grey","S":"--grey",
};
const DARK_TEXT = new Set(["N","Q","R","W","L","S"]);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);

function bullet(line){
  const c = css(LINE_COLOR[line] || "--grey");
  const cls = "bul" + (DARK_TEXT.has(line) ? " dark" : "") + (line === "SIR" ? " sir" : "");
  return `<span class="${cls}" style="background:${c}">${line}</span>`;
}

let game, openCoin = null;

function tagFor(c, price){
  const pos = (price - c.low) / (c.high - c.low);
  if (pos <= 0.2) return '<span class="tag cheap">CHEAP</span>';
  if (pos >= 0.8) return '<span class="tag dear">DEAR</span>';
  return "";
}

function render(){
  const g = game, p = g.player;
  const net = g.netWorth();
  $("day").textContent = `DAY ${Math.min(g.day, DAYS)} OF ${DAYS}`;
  $("station").textContent = g.station.name;
  $("bullets").innerHTML = g.station.lines.map(bullet).join("");
  $("flavor").textContent = g.station.flavor;
  $("cash").textContent = fmtMoney(p.cash);
  $("cash").className = "num " + (p.cash > 0 ? "up" : "down");
  $("debt").textContent = fmtMoney(p.debt);
  $("debt").className = "num " + (p.debt > 0 ? "down" : "flat");
  $("vault").textContent = fmtMoney(p.vault);
  $("net").textContent = fmtMoney(net);
  $("net").className = "num " + (net >= 0 ? "up" : "down");
  const used = g.usedCapacity();
  $("capbar").style.width = Math.min(100, used / p.capacity * 100) + "%";
  $("capnum").textContent = `$${Math.round(used).toLocaleString()} / $${Math.round(p.capacity).toLocaleString()}`;

  $("alerts").innerHTML = g.market.headline
    ? `<div class="alert ${g.market.shock.crash ? "bad" : ""}">${g.market.headline}</div>` : "";

  $("market").innerHTML = COINS.map(c => {
    const price = g.market.prices[c.symbol];
    const h = p.wallet[c.symbol] || { qty: 0, cost: 0 };
    const open = openCoin === c.symbol;
    const canBuy = g.maxBuyable(c.symbol);
    const heldLine = h.qty > 0
      ? `<div class="held num">${fmtQty(h.qty)} · ${fmtMoney(h.qty * price)}</div>` : "";
    let trade = "";
    if (open) {
      const rows = [];
      if (canBuy > 0) rows.push(`<div class="btns">
        <button class="buy" data-buy="${c.symbol}" data-frac="0.25">BUY 25%</button>
        <button class="buy" data-buy="${c.symbol}" data-frac="0.5">BUY 50%</button>
        <button class="buy" data-buy="${c.symbol}" data-frac="1">BUY MAX</button></div>`);
      else rows.push(`<div class="note">No room or no cash for ${c.symbol} right now.</div>`);
      if (h.qty > 0) rows.push(`<div class="btns">
        <button class="sell" data-sell="${c.symbol}" data-frac="0.5">SELL HALF</button>
        <button class="sell" data-sell="${c.symbol}" data-frac="1">SELL ALL</button></div>`);
      rows.push(`<div class="note">${c.note}${h.qty > 0 ? ` · you paid ${fmtPrice(h.cost / h.qty)} avg` : ""}</div>`);
      trade = rows.join("");
    }
    return `<div class="coin${open ? " open" : ""}">
      <div class="coinrow" data-coin="${c.symbol}" role="button" tabindex="0">
        <div><div class="sym">${c.symbol}</div></div>
        <div><div class="cname">${c.name}</div></div>
        <div class="px"><b class="num">${fmtPrice(price)}</b>${tagFor(c, price)}${heldLine}</div>
      </div>
      <div class="trade">${trade}</div>
    </div>`;
  }).join("");

  const st = g.station, svc = [];
  if (st.shark) {
    svc.push(`<button data-act="borrow">BORROW $2,500</button>`);
    if (p.debt > 0) svc.push(`<button data-act="repay">REPAY ${fmtMoney(Math.min(p.cash, p.debt))}</button>`);
  }
  if (st.vault) {
    svc.push(`<button data-act="deposit">VAULT HALF</button>`);
    if (p.vault > 0) svc.push(`<button data-act="withdraw">TAKE ALL OUT</button>`);
  }
  if (st.shop) {
    svc.push(`<button data-act="capacity">+$25K WALLET · ${fmtMoney(g.upgradeCost())}</button>`);
    if (p.vpn < 3) svc.push(`<button data-act="vpn">VPN LV${p.vpn + 1} · ${fmtMoney(g.vpnCost())}</button>`);
  }
  $("svcwrap").hidden = svc.length === 0;
  $("svc").innerHTML = svc.join("");

  $("log").innerHTML = g.log.slice(-7).reverse()
    .map(l => `<div class="logline">${l}</div>`).join("");
}

function flash(msg, good){
  const div = document.createElement("div");
  div.className = "alert" + (good ? "" : " bad");
  div.textContent = msg;
  $("alerts").prepend(div);
  setTimeout(() => div.remove(), 3200);
}

function act(fn){
  try { const r = fn(); if (r && r.text) { game.say(r.text); flash(r.text, r.good !== false); } }
  catch (e) { flash(e.message, false); }
  render();
  persist();
}

$("main").addEventListener("click", e => {
  const row = e.target.closest("[data-coin]");
  if (row && !e.target.closest("button")) {
    openCoin = openCoin === row.dataset.coin ? null : row.dataset.coin;
    return render();
  }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.buy) {
    const sym = b.dataset.buy, frac = parseFloat(b.dataset.frac);
    return act(() => game.buy(sym, game.maxBuyable(sym) * frac));
  }
  if (b.dataset.sell) {
    const sym = b.dataset.sell, frac = parseFloat(b.dataset.frac);
    return act(() => game.sell(sym, (game.player.wallet[sym]?.qty || 0) * frac));
  }
  const a = b.dataset.act;
  if (a === "borrow") return act(() => game.borrow(2500));
  if (a === "repay") return act(() => game.repay(Math.min(game.player.cash, game.player.debt)));
  if (a === "deposit") return act(() => game.deposit(game.player.cash / 2));
  if (a === "withdraw") return act(() => game.withdraw(game.player.vault));
  if (a === "capacity") return act(() => game.buyCapacity());
  if (a === "vpn") return act(() => game.buyVpn());
});

$("main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset.coin) {
    e.preventDefault(); e.target.click();
  }
});

$("ride").addEventListener("click", () => {
  $("stops").innerHTML = STATIONS.map((s, i) => {
    if (s.name === game.station.name) return "";
    const chips = [
      s.shark ? '<span class="chip shark">SHARK</span>' : "",
      s.vault ? '<span class="chip vault">VAULT</span>' : "",
      s.shop ? '<span class="chip shop">SHOP</span>' : "",
      `<span class="heat">HEAT ${"▮".repeat(Math.round(s.heat * 5))}${"▯".repeat(5 - Math.round(s.heat * 5))}</span>`,
    ].join("");
    return `<div class="stop" data-go="${i}" role="button" tabindex="0">
      <div><div class="nm">${s.name}</div><div class="meta">${chips}</div></div>
      <div class="bullets">${s.lines.map(bullet).join("")}</div></div>`;
  }).join("");
  $("travel").classList.add("on");
});
$("cancel").addEventListener("click", () => $("travel").classList.remove("on"));
$("stops").addEventListener("click", e => {
  const s = e.target.closest("[data-go]");
  if (!s) return;
  $("travel").classList.remove("on");
  openCoin = null;
  try {
    const msgs = game.travel(parseInt(s.dataset.go, 10));
    render();
    const notable = msgs.slice(2).find(m => m);
    if (notable) flash(notable, !/SEC|drainer|Gas|Signal|Shark's/.test(notable));
  } catch (err) { flash(err.message, false); }
  persist();
  if (game.finished) showFinal();
});

function showFinal(){
  const g = game, p = g.player, score = g.finalScore();
  const board = recordScore(g);
  clearSave();
  const rank = board.findIndex(s => Math.abs(s.net_worth - score) < 1e-9);
  $("fscore").textContent = fmtMoney(score);
  $("fscore").className = "big num " + (score >= 0 ? "up" : "down");
  $("fverdict").textContent = g.verdict();
  $("fbreak").innerHTML = [
    ["cash", fmtMoney(p.cash)], ["vault", fmtMoney(p.vault)],
    ["holdings", fmtMoney(g.portfolioValue())], ["debt", "-" + fmtMoney(p.debt).replace("-", "")],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("");
  if (rank === 0) $("fverdict").textContent = "A new best run. " + $("fverdict").textContent;
  else if (rank > 0 && rank < 5) $("fverdict").textContent =
    `Number ${rank + 1} on your board. ` + $("fverdict").textContent;
  $("over").classList.add("on");
}

/* ------------------------------ persistence ---------------------------- */
/* The run is written after every move, so closing the tab mid-game loses
   nothing. The saved RNG state means reopening replays the same dice - you
   cannot close the tab to dodge a raid you have already walked into. */
function persist(){ if (game && !game.finished) writeSave(game); }

function showScores(){
  const scores = readScores();
  $("scorelist").innerHTML = scores.length
    ? scores.slice(0, 15).map((s, i) => `<div class="stop">
        <div><div class="nm num ${s.net_worth >= 0 ? "up" : "down"}">${fmtMoney(s.net_worth)}</div>
        <div class="meta"><span class="heat">DAY ${s.day} · ${new Date(s.finished_at * 1000)
          .toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span></div></div>
        <div class="heat" style="max-width:150px;text-align:right">${s.verdict.split(".")[0]}</div>
      </div>`).join("")
    : `<div class="note" style="padding:14px 2px">No finished runs yet. Survive thirty days and you'll have one.</div>`;
  $("scores").classList.add("on");
}
$("board").addEventListener("click", showScores);
$("closescores").addEventListener("click", () => $("scores").classList.remove("on"));

function start(seed){
  game = new Game(seed);
  openCoin = null;
  clearSave();
  ["over", "travel", "scores"].forEach(id => $(id).classList.remove("on"));
  render();
  persist();
}

function boot(){
  const resumed = readSave();
  if (resumed && !resumed.finished) {
    game = resumed;
    openCoin = null;
    render();
    flash(`Picked up where you left off - day ${game.day}, ${game.station.name}.`, true);
  } else {
    start(Math.floor(Math.random() * 1e9));
  }
}

$("newgame").addEventListener("click", () => {
  if (game && !game.finished && game.day > 1
      && !confirm("Abandon the run in progress and start over?")) return;
  start(Math.floor(Math.random() * 1e9));
});
$("again").addEventListener("click", () => start(Math.floor(Math.random() * 1e9)));

/* carry the run across a republish as well as a page close */
window.claude?.hot?.snapshot?.(() => (game ? saveToDict(game) : null));
boot();
</script>
</body>
</html>
